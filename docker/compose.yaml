version: '3.8'

services:
  db:
    expose:
      - 3306
    image: arm64v8/mysql
    volumes:
      - ./docker-bootstrap/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    environment:
      MYSQL_DATABASE: wp_db
      MYSQL_USER: admin
      MYSQL_ROOT_PASSWORD: password
      MYSQL_PASSWORD: 1234
    networks:
      - wp

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      - PMA_HOST=db
      - MYSQL_ROOT_PASSWORD=password
      - PMA_ARBITRARY=1
      - UPLOAD_LIMIT=300M
    depends_on:
      - db
    networks:
      - wp

  wordpress:
    ports:
      - "${PORT:-8001}:80"
      - "443:443"
    depends_on:
      - db
    image: wordpress:php8.2
    volumes:
      - ./wp_data/wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp_data/php.ini:/var/www/html/php.ini
    environment:
      WORDPRESS_DB_NAME: wp_db
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true );
    networks:
      - wp
networks:
  wp:
volumes:
  wp_data: