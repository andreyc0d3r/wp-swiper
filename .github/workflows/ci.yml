name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Check PHP syntax
        run: find . -path ./node_modules -prune -o -path ./dist-zip -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test block editor asset loading
        run: php tests/php/editor-assets.php

      - name: Build and verify package
        run: npm run package

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: wp-swiper
          path: dist-zip/wp-swiper.zip
          if-no-files-found: error

  browser-smoke:
    name: Browser smoke (WordPress ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - "6.3.8"
          - "7.0.2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify plugin package
        run: npm run package

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: node scripts/run-e2e.mjs "${{ matrix.wordpress }}"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-wordpress-${{ matrix.wordpress }}
          path: artifacts/wordpress-${{ matrix.wordpress }}
          if-no-files-found: ignore
